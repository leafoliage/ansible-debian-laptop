---
- name: Install code package
  ansible.builtin.apt:
    name: code
    state: present
  become: true

- name: Install vlc apt package
  ansible.builtin.apt:
    name: vlc
    state: present
  become: true

- name: Install remmina apt package
  ansible.builtin.apt:
    name: remmina
    state: present
  become: true

- name: Install kitty apt package
  ansible.builtin.apt:
    name: kitty
    state: present
  become: true
