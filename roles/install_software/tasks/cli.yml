---
- name: Install essential tools apt package
  ansible.builtin.apt:
    name:
      - vim
      - tmux
      - htop
    state: present
  become: true

- name: Install vpn apt package
  ansible.builtin.apt:
    name:
      - wireguard
    state: present
  become: true

- name: Install fish apt pakcage
  ansible.builtin.apt:
    name:
      - fish
    state: present
  become: true

- name: Install qemu apt package
  ansible.builtin.apt:
    name:
      - qemu-system
      - qemu-utils
    state: present
  become: true

- name: Install build-essential package
  ansible.builtin.apt:
    name:
      - build-essential
      - gdb
    state: present
  become: true

- name: Install python apt package
  ansible.builtin.apt:
    name:
      - python3
      - python3-dev
      - python3-pip
      - python3-poetry
      - python3-venv
      - pipx
    state: present
  become: true

- name: Install python pwntools apt package
  ansible.builtin.apt:
    name:
      - python3-pwntools
      - python3-ropgadget
    state: present
  become: true

- name: Install ansible pipx package
  vars:
    pipx_packages:
      - ansible
      - ansible-lint
  community.general.pipx:
    name: "{{ item }}"
    state: install
  with_items: "{{ pipx_packages }}"

- name: Install sshpass apt package
  ansible.builtin.apt:
    name: sshpass
    state: present
  become: true

- name: Install nvidia driver apt package
  ansible.builtin.apt:
    name: nvidia-driver
    state: present
  become: true

- name: Install tldr apt package
  ansible.builtin.apt:
    name: tldr
    state: present
  become: true

- name: Install net tools apt package
  ansible.builtin.apt:
    name:
      - net-tools
      - curl
      - netcat-openbsd
      - tcpdump
    state: present
  become: true

- name: Install ftp apt packages
  ansible.builtin.apt:
    name:
      - ftp
      - tftp
    state: present
  become: true

- name: Install zip apt packages
  ansible.builtin.apt:
    name:
      - cpio
      - bzip2
      - zip
      - unzip
    state: present
  become: true

- name: Install docker package
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true

- name: Clone pwndbg repository
  ansible.builtin.git:
    repo: https://github.com/pwndbg/pwndbg.git
    dest: /opt/pwndbg
    version: 2025.05.30
  become: true

- name: Gdbinit set pwndbg
  ansible.builtin.lineinfile:
    path: "/home/{{ username }}/.gdbinit"
    line: source /opt/pwndbg/gdbinit.py
    mode: '0644'
    create: true

- name: Install debconf apt package
  ansible.builtin.apt:
    name:
      - debconf
      - debianutils
    state: present
  become: true
