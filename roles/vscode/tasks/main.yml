---
- name: Add vscode apt sources list
  deb822_repository:
    name: vscode
    types: deb
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  become: true

- name: Run apt update
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install code package
  ansible.builtin.apt:
    name: code
    state: present
  become: true
