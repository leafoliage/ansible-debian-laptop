---
- name: "Create automation user"
  become: true
  ansible.builtin.user:
    name: "{{ automation_user }}"
    local: true
    create_home: true

- name: "Set SSH public key"
  become: true
  ansible.posix.authorized_key:
    user: "{{ automation_user }}"
    key: "{{ automation_pubkey }}"
    state: present
  when: 'automation_pubkey | default("") | length > 0'

- name: "Grant for sudo access"
  become: true
  community.general.sudoers:
    name: "ansible"
    user: "{{ automation_user }}"
    state: present
    runas: "ALL"
    commands: "ALL"
    nopassword: true
    validation: required
