---
- name: Install linux headers
  ansible.builtin.apt:
    name: linux-headers-amd64
    state: present
  become: true

- name: Add Debian non-free repository
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: 'Components: main non-free-firmware$'
    replace: 'Components: main contrib non-free non-free-firmware'
  become: true

- name: Run apt update
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install nvidia-detect
  ansible.builtin.apt:
    name:
      - nvidia-detect
      - nvidia-driver
      - nvidia-smi
      - nvidia-settings
    state: present
  become: true
