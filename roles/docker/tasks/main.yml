---
- name: Add docker apt sources list
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ codename }}"
    components:
      - stable
    signed_by: https://download.docker.com/linux/debian/gpg
  become: true

- name: Run apt update
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install docker package
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true
